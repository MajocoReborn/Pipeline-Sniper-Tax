[package]
name = "sniper-tax-tests"
version = "0.1.0"
edition.workspace = true
publish = false
description = "LiteSVM integration tests: the sniper-tax program against the real Pipeline router"

[dependencies]
bincode = "1"
borsh = { version = "1.5", features = ["derive"] }
litesvm = "=0.18.2"
pipeline-client = { git = "https://github.com/MetalLegBob/pipeline", rev = "a2d5bfbe62ff61d3ca0ce7a976520da61a0f16c4" }
pipeline-strategy-interface = { git = "https://github.com/MetalLegBob/pipeline", rev = "a2d5bfbe62ff61d3ca0ce7a976520da61a0f16c4" }
sniper-tax-math = { path = "../sniper-tax-math" }
solana-account = "=4.7.0"
solana-clock = "~3.2.0"
solana-instruction = "=3.5.1"
solana-keypair = "=3.1.2"
solana-pubkey = "=4.3.0"
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
solana-transaction = { version = "=4.3.0", features = ["serde"] }
spl-associated-token-account-interface = "2.0.0"
spl-token-2022-interface = "3.1.2"
