name: ci

on:
  push:
  pull_request:

jobs:
  host:
    # Host-side crates.
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-host-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-host-v1-

      - name: No keypairs in the repository
        run: scripts/check-no-keypairs.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  program:
    # The on-chain program: formatting, lints on the host, and the sBPF v3 build.
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo and Solana tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-build-sbf
            ~/.cargo/bin/cargo-test-sbf
            ~/.cache/solana
            programs/target
          key: ${{ runner.os }}-program-v1-${{ hashFiles('programs/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-program-v1-

      - name: Install cargo-build-sbf (sBPF v3 toolchain)
        run: |
          if ! cargo build-sbf --version 2>/dev/null | grep -q "4.6.0"; then
            cargo install cargo-build-sbf --version 4.6.0 --locked --force
          fi

      - name: Check formatting
        working-directory: programs
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: programs
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: programs
        run: cargo build-sbf
