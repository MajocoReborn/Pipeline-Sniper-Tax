name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: No keypairs in the repository
        run: scripts/check-no-keypairs.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The SDK comes from MajocoReborn/pipeline-sniper-tax-strategy at a pinned commit, with
      # the Rust client's test vectors from the same commit.
      - name: The vendored SDK and the vectors are that commit's
        run: scripts/update-sdk.sh --check

  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck, format and test
        run: npm test

      - name: Build the site
        run: npm run build
