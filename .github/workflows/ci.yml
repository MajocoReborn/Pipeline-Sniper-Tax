name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      # Test binaries link every Solana crate; without debug info they're a fraction of
      # the size.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo and Solana tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-build-sbf
            ~/.cargo/bin/cargo-test-sbf
            ~/.cache/solana
            target
            programs/target
          key: ${{ runner.os }}-v1-${{ hashFiles('Cargo.lock', 'programs/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-v1-

      - name: No keypairs in the repository
        run: scripts/check-no-keypairs.sh

      - name: Install cargo-build-sbf (sBPF v3 toolchain)
        run: |
          if ! cargo build-sbf --version 2>/dev/null | grep -q "4.6.0"; then
            cargo install cargo-build-sbf --version 4.6.0 --locked --force
          fi

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          (cd programs && cargo fmt --all -- --check)

      - name: Lint
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          (cd programs && cargo clippy --all-targets -- -D warnings)

      - name: Build the program
        working-directory: programs
        run: cargo build-sbf

      - name: Fetch the Pipeline router from devnet (pinned)
        run: scripts/fetch-pipeline-router.sh

      - name: Test
        run: cargo test --workspace
