name: ci

on:
  push:
  pull_request:

# The jobs only read the repository. Actions are pinned to a commit, not a tag that can move.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      # Test binaries link every Solana crate; without debug info they're a fraction of
      # the size.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo and Solana tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-build-sbf
            ~/.cargo/bin/cargo-test-sbf
            ~/.cache/solana
            target
            programs/target
            test-programs/target
          key: ${{ runner.os }}-v1-${{ hashFiles('Cargo.lock', 'programs/Cargo.lock', 'test-programs/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-v1-

      - name: No keypairs in the repository
        run: scripts/check-no-keypairs.sh

      - name: Install cargo-build-sbf (sBPF v3 toolchain)
        run: |
          if ! cargo build-sbf --version 2>/dev/null | grep -q "4.6.0"; then
            cargo install cargo-build-sbf --version 4.6.0 --locked --force
          fi

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          (cd programs && cargo fmt --all -- --check)
          (cd test-programs && cargo fmt --all -- --check)

      - name: Lint
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          (cd programs && cargo clippy --all-targets -- -D warnings)
          (cd test-programs && cargo clippy --all-targets -- -D warnings)

      - name: Build the program
        working-directory: programs
        run: cargo build-sbf

      - name: Build the test programs
        working-directory: test-programs
        run: cargo build-sbf

      - name: Fetch the Pipeline router from devnet (pinned)
        run: scripts/fetch-pipeline-router.sh

      - name: Test
        run: cargo test --workspace

      - name: The TypeScript client's test vectors are up to date
        run: |
          cargo run -q -p sniper-tax-client --example ts_vectors > app/test/vectors.json
          git diff --exit-code app/test/vectors.json

  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # app/.npmrc keeps dependencies from running install scripts.
      - name: Install
        run: npm ci

      - name: Dependencies are the ones the registry signed
        run: npm audit signatures

      - name: Typecheck, format and test
        run: npm test

      - name: Build the site
        run: npm run build

      # The built site in the runner's Chrome, against a stand-in RPC and API: no network.
      - name: The site in Chromium, with a stand-in wallet
        run: BROWSER_E2E=1 npx vitest run test/browser.e2e.test.ts
