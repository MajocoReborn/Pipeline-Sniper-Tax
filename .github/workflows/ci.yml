name: ci

on:
  push:
  pull_request:

jobs:
  host:
    # Host-side crates. The on-chain program gets its own `cargo build-sbf` job once it
    # exists (phase 2 in docs/PLAN.md).
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-host-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-host-v1-

      - name: No keypairs in the repository
        run: scripts/check-no-keypairs.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
