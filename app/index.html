<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!--
            Only this site's own scripts and styles run. The page talks to the devnet RPC and to
            Pipeline's API, and loads token images over HTTPS. Wallet extensions inject through
            the Wallet Standard, which a CSP doesn't block. `frame-ancestors` only works as a
            header, so the host must send `Content-Security-Policy: frame-ancestors 'none'` (a
            page that asks for signatures must not be framed).
        -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self' https://api.devnet.solana.com wss://api.devnet.solana.com https://pipeline-devnet.up.railway.app; object-src 'none'; base-uri 'none'; form-action 'none'"
        />
        <title>Sniper Tax Launch (devnet)</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
